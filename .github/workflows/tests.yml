name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        # sentence-transformers pulls the CUDA build of torch by default, which
        # adds ~2.5 GB of GPU wheels this CPU-only runner never uses.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q
